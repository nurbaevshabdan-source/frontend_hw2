<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">Landing.</div>
        <nav class="nav">
            <a href="#home">Home</a>
            <a href="#about">About Me</a>
        </nav>
    </header>

    <!-- SECTION HOME -->
    <section id="home" class="section-home">
        <div class="home-content">
            <h1>Creative Design & <br>Frontend Development</h1>
            <p>Welcome to my official landing page template.</p>
            <a href="#about" class="btn">Learn More</a>
        </div>
    </section>

    <!-- SECTION ABOUT ME -->
    <section id="about" class="section-about">
        <div class="about-container">
            <div class="about-text">
                <h2>About Me</h2>
                <p>I am a frontend developer focused on creating clean, functional, and modern web interfaces. This layout is fully completed according to the task requirements.</p>
            </div>
            <div class="about-img">
                <!-- Заглушка вместо картинки -->
                <div class="img-placeholder">Photo</div>
            </div>
        </div>
    </section>

</body>
</html>
